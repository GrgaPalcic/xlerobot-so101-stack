/**:
  ros__parameters:
    framerate: 30.0
    jpeg_quality: 85
/follower/cam_wrist:
  ros__parameters:
    video_device: /dev/v4l/by-id/usb-Arducam_Technology_Co.__Ltd._Arducam_OV9782_USB_Camera_UC852-video-index0
    fourcc: MJPG
    image_width: 1280
    image_height: 800
    fallback_fov_degrees: 70.0
    frame_id: follower/wrist_camera_optical_frame
    camera_name: cam_wrist
/static_camera/cam_overhead:
  ros__parameters:
    video_device: /dev/video42
    fourcc: YUYV
    capture_backend: ffmpeg_raw
    ffmpeg_input_format: yuyv422
    image_width: 1280
    image_height: 720
    fallback_fov_degrees: 113.0
    # Do not fall back to the laptop webcam here. The GoPro calibration and
    # extrinsics are invalid for /dev/video0, so wrong-camera fallback creates
    # plausible but unsafe grasp geometry.
    frame_id: follower/static_camera_optical_frame
    camera_name: cam_overhead
