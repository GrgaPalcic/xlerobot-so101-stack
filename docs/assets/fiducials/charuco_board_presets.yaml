# Named ChArUco/ArUco board presets used by the XLeRobot calibration runbook
# and xlerobot-calib CLI.
#
# The "cols" and "rows" values are checkerboard squares, not marker counts.
# Sizes are physical printed dimensions in meters.
default_intrinsics_preset: intrinsics_a3_11x8_34_25_id2
default_world_preset: world_plate_a_7x5_20_14_id49

presets:
  intrinsics_a3_11x8_34_25_id2:
    role: intrinsics
    description: Large caib.io board used for camera intrinsics.
    asset: calib.io_charuco_420x297_8x11_34_25_DICT_5X5.pdf
    generator: calib.io
    page_size: A3 landscape, 420 mm x 297 mm
    dictionary: DICT_5X5_100
    cols: 11
    rows: 8
    square_m: 0.034
    marker_m: 0.025
    start_id: 2
    marker_count: 44
    pattern_width_m: 0.374
    pattern_height_m: 0.272
    cli_config:
      intr_cols: 11
      intr_rows: 8
      intr_square_m: 0.034
      intr_marker_m: 0.025
      intr_start_id: 2
      intr_marker_count: 44
      intr_dict: DICT_5X5_100

  world_plate_a_7x5_20_14_id49:
