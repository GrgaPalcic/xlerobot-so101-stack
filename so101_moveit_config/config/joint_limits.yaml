# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.25
default_acceleration_scaling_factor: 0.20

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  elbow_flex:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_deceleration_limits: true
    max_deceleration: -2.0
  gripper:
    has_position_limits: true
    # Follower gripper calibration reports negative closed/open-side values.
    # Keep MoveIt's state monitor from rejecting the calibrated live joint state.
    min_position: -1.0
    max_position: 1.74533
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_deceleration_limits: true
    max_deceleration: -2.0
  shoulder_lift:
    has_position_limits: true
    # The calibrated follower can report around -1.80 rad at the physical
    # table-side pose; the nominal URDF lower bound (-1.74533) rejects it.
    min_position: -1.95
    max_position: 1.74533
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_deceleration_limits: true
    max_deceleration: -2.0
  shoulder_pan:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_deceleration_limits: true
    max_deceleration: -2.0
  wrist_flex:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_deceleration_limits: true
    max_deceleration: -2.0
  wrist_roll:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_deceleration_limits: true
    max_deceleration: -2.0
